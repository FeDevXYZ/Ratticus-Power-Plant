<!doctype html>
<html lang="it">
<head>
  <style>
    body{
      background: url("https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp");
    }
  </style>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terra town needs help!</title>
</head>
<body id="body">
  <div id="maindiv" style="color: white;
              display: flex;
              align-items: flex-end;
              justify-content: center;
              width: 98%;
              height: 98vh;">
    <img id="img" src="https://terra.hackclub.com/assets/sprites/npcs/sir-ratticus/grudging.webp" alt="Ratticus" style="height: 500px; width: 500px; object-fit: contain; z-index: 1; cursor: pointer">
    <div style="cursor: pointer; width: 1000px; height: 150px; margin-bottom: 70px; margin-left: -250px; background: url('dialogue-box.svg'); background-size: contain; background-repeat: no-repeat; padding: 20px 200px 20px 200px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
      <p id="text" style="color: black; font-size: 1.5em;">HEY PONCHO! TERRA'S TOWN IS OFFLINE, AND I NEED YOU TO FIX IT!!!</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">

    </div>
  </div>

  <script>
    window.addEventListener("pagehide", () => {
      navigator.sendBeacon("/closed", "");
      console.log("Page has been closed.")
    });
    body = document.getElementById("body")
    maindiv = document.getElementById("maindiv")
    text = document.getElementById("text")
    img = document.getElementById("img")

    let phase = 1
    maindiv.addEventListener("click", () => {
      if(phase === 1){
        body.style.backgroundSize = "cover"
        text.textContent = "I NEED YOU TO START THE POWER PLANT NEAR HERE! LET ME EXPLAIN PONCHO!!!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/sir-ratticus/idle1.webp"
        phase = phase += 1
      }
      else if(phase === 2){
        body.style.background = "url('https://thumbs.dreamstime.com/b/power-plant-flat-color-industrial-facility-d-cartoon-landscape-energy-manufacturing-station-electricity-production-factory-288915275.jpg')"
        body.style.backgroundSize = "cover"
        text.textContent = "TERRA TOWN DOESN'T HAVE ELECTRICITY, AND STILL USES JACK 'O LANTERNS ON THE 16 NOVEMBER! THAT IS UNACCEPTABLE!!!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/sir-ratticus/idle2.webp"
        phase = phase += 1
      }
      else if(phase === 3){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.textContent = "I HEARD THAT BANANAS ARE RADIOACTIVE... SO YOU'LL START THE POWER PLANT WITH THOSE!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/sir-ratticus/grudging.webp"
        phase = phase += 1
      }
      else if(phase === 4){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.textContent = "SOMEONE WILL GIVE YOU INFO. I DON'T CARE. GET POWERING PONCHO!!!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/sir-ratticus/idle1.webp"
        phase = phase += 1
      }
      else if(phase === 5){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "hey! i am poobert, i'll give you info about running the power plant!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 6) {
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "so: you will need to regulate the <strong>bananas per minute</strong>, they produce power!"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 7){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "but more bananas per minute means <strong>higher temperature</strong>! <em>you shouldn't go past 550 degrees, or... i'll leave it to your imagination.</em>"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 8){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "you can cool the power plant using the 10 <strong>cooling cores</strong> you have. each one removes <em>7% of the total temperature.</em>"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 9){
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "and <strong>you should try to keep the frequency at 50Hz</strong>. the frequency <em>raises</em> when you <em>produce more than terra town needs</em>, and <em>lowers</em> when you <em>produce less than it needs</em>."
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 10) {
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "now go and illuminate terra town! ratticus will probably talk to you through a speaker, so <strong>keep your volume up!</strong>"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
      else if(phase === 11) {
        window.close()
        body.style.background = "url('https://terra.hackclub.com/assets/loginscreen/landing-frame-4-q80.webp')"
        body.style.backgroundSize = "cover"
        text.innerHTML = "<em>close the page to continue the game!</em>"
        img.src = "https://terra.hackclub.com/assets/sprites/npcs/poobert/idle.webp"
        img.style.transform = "scale(0.7) translateY(20px)"
        phase = phase += 1
      }
    })
  </script>

</body>
</html>
