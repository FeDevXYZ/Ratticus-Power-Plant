name: Build Windows EXE

on:
  workflow_dispatch:        # avvio manuale dalla tab Actions
  push:
    tags:
      - "v*"                # avvio automatico quando pushi un tag tipo v1.0.0

permissions:
  contents: write           # serve per creare la Release con l'exe allegato

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flask>=3.1.3" "pyfiglet>=1.0.4" pyinstaller

      - name: Build exe
        run: >
          pyinstaller main.py
          --onefile
          --name RatticusPowerPlant
          --collect-data pyfiglet
          --add-data "templates;templates"
          --add-data "static;static"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatticusPowerPlant-windows
          path: dist/RatticusPowerPlant.exe

      - name: Publish release (solo con i tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RatticusPowerPlant.exe
